[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sonora-studio"
version = "1.0.0"
description = "Professional Desktop AI Audio Recording & Editing Studio for Windows"
readme = "README.md"
authors = [
    { name = "Venarus", email = "developer@sonora-audio.local" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "audio", "recording", "editor", "ai-audio", "noise-reduction",
    "spectral-gating", "dsp", "waveform", "pyside6", "qt", "windows11"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
    "Topic :: Multimedia :: Sound/Audio :: Editors",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "PySide6>=6.6.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "noisereduce>=3.0.0",
    "qtawesome>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
sonora = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "ui*"]
